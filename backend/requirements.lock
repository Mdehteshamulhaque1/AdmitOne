# Exact versions of the tree this suite was last verified against.
#
# requirements.txt stays the human-edited file: it states the compatibility
# ranges the project believes in, and it is what you edit when adding a
# dependency. This file is what CI installs, so two builds of the same commit
# install the same code instead of whatever the latest satisfying release
# happens to be.
#
# That difference is not theoretical. Every direct dependency is specified with
# a `>=` and no upper bound except Django's, so a release published overnight
# would be picked up on the next deploy with no change to the repository. The
# only places that could be caught are CI and a production rollback, and both
# need to be able to reconstruct what was running.
#
# Regenerating:
#   1. pip install -r requirements.txt
#   2. pip freeze --exclude pip --exclude setuptools --exclude wheel
#   3. Keep only what requirements.txt asked for and what it dragged in,
#      drop tooling that is not a project dependency, and paste here.
#   4. Run the suite. A version bump that has not been tested is not a pin,
#      it is a guess.
#
# No hashes yet. They need `pip-compile --generate-hashes`, which requires
# resolving against PyPI; the usual reason to defer them is a network-restricted
# build. Adding them upgrades this from "the versions were pinned" to "the
# bytes were pinned", which is worth doing before the first production deploy.
#
# Verified locally with a fresh `python -m venv` install on Windows, Python
# 3.14.3: 657 tests, 0 failures. CI installs this on Linux/Python 3.11; every
# package below ships a wheel for both.
#
# colorama appears because `qrcode` pulls it in on Windows (sys_platform ==
# 'win32'). On Linux it resolves to absent, and pinning it is harmless there.
#
# Version note: the declared runtime everywhere -- render.yaml PYTHON_VERSION,
# CI setup-python, and the .python-version file in this directory -- is 3.11,
# but the only interpreter on this machine is 3.14, which is what this lock was
# verified against. The three agree in effect (Django 5.2.17, gunicorn,
# Pillow 12.3.0 and psycopg all support both) but the local 3.14 needs to
# converge on the declared 3.11 before anyone can claim dev == prod.

