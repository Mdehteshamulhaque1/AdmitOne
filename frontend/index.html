<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta
      name="description"
      content="AdmitOne — multi-tenant access-control platform with HMAC-signed single-use QR passes"
    />
    <meta property="og:title" content="AdmitOne" />
    <meta property="og:description" content="Secure every visitor. Protect every workplace." />
    <meta property="og:type" content="website" />
    <title>AdmitOne — Visitor & Gate Access Management</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      (function () {
        try {
          var pref = localStorage.getItem("sg_theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
