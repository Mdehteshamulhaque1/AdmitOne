[project]
name = "admitone-backend"
version = "1.0.0"
description = "AdmitOne — multi-tenant access-control platform with HMAC-signed single-use QR passes"
requires-python = ">=3.11"
# Runtime dependencies live in backend/requirements.txt (used by Render).

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["F", "E9"]